server:
  port: 8080

spring:
  application:
    name: datashare-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:datashare}
    username: ${POSTGRES_USER:datashare}
    password: ${POSTGRES_PASSWORD:datashare}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-1234567890-abcdefgh}
    expiration-seconds: 3600
  storage:
    base-path: ${STORAGE_PATH:./storage}
  upload:
    max-size-bytes: 1073741824 # 1 Go
    forbidden-extensions: exe,bat,sh,cmd,msi



