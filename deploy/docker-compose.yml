services:
  postgres:
    image: postgres:16
    container_name: datashare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-datashare}
      POSTGRES_USER: ${POSTGRES_USER:-datashare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datashare}
    ports:
      - "5432:5432"
    volumes:
      - datashare-postgres-data:/var/lib/postgresql/data

volumes:
  datashare-postgres-data:
